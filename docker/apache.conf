<VirtualHost *:80>
    DocumentRoot /var/www/public
    ServerSignature Off

    <Directory /var/www/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # Only api.php may run as PHP; any other .php file under public/ is refused.
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    <Files "api.php">
        Require all granted
    </Files>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    # Scripts, data and documents come only from this server. Inline handlers are still used by the page.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

    # Scripts and styles are re-checked on every visit (a quick "not modified" reply when unchanged),
    # so browsers never keep running an old version after an update. Images may be reused for an hour.
    <FilesMatch "\.(css|js)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "\.(png|jpg|svg)$">
        Header set Cache-Control "public, max-age=3600"
    </FilesMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
