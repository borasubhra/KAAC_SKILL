; Portal-specific PHP settings (on top of php.ini-production).
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Seven documents of up to 3 MB each fit in one registration.
upload_max_filesize = 4M
post_max_size = 32M
max_file_uploads = 12
memory_limit = 256M

session.cookie_httponly = 1
session.cookie_samesite = Strict
session.use_strict_mode = 1
session.gc_maxlifetime = 28800

date.timezone = Asia/Kolkata
